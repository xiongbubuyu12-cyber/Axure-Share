<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI-PIM | PW经销商提报</title>
    <style>
        :root {
            --ink: #171717;
            --muted: #737373;
            --line: #e6e6e6;
            --soft: #f6f6f6;
            --panel: #fff;
            --danger: #c8102e;
            --danger-soft: #fff1f2;
            --success: #16734b;
            --success-soft: #e9f7ef;
            --warn: #9a5a00;
            --warn-soft: #fff7e6;
            --shadow: 0 14px 38px rgba(0, 0, 0, .12);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: #f4f4f4;
            color: var(--ink);
            font-size: 14px
        }

        button,
        input,
        select,
        textarea {
            font: inherit
        }

        button {
            cursor: pointer
        }

        .app {
            min-height: 100vh;
            display: flex
        }

        .side {
            width: 232px;
            background: #141414;
            color: #fff;
            display: flex;
            flex-direction: column
        }

        .brand {
            height: 70px;
            padding: 20px 22px;
            border-bottom: 1px solid #343434;
            font-weight: 700;
            letter-spacing: .5px
        }

        .brand b {
            display: inline-flex;
            width: 27px;
            height: 27px;
            background: var(--danger);
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-size: 15px
        }

        .nav {
            padding: 20px 12px
        }

        .nav-label {
            font-size: 11px;
            color: #8f8f8f;
            padding: 0 12px 10px
        }

        .nav a {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 12px;
            border-radius: 6px;
            color: #cfcfcf;
            text-decoration: none;
            margin: 3px 0
        }

        .nav a.active {
            background: #2a2a2a;
            color: #fff;
            border-left: 3px solid var(--danger);
            padding-left: 9px
        }

        .nav i {
            width: 18px;
            text-align: center;
            color: #aaa;
            font-style: normal
        }

        .user {
            margin-top: auto;
            padding: 16px;
            border-top: 1px solid #343434;
            color: #ccc;
            font-size: 12px
        }

        .avatar {
            display: inline-flex;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #fff;
            color: #222;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            margin-right: 8px
        }

        .main {
            flex: 1;
            min-width: 0
        }

        .top {
            height: 70px;
            background: #fff;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px
        }

        .crumb {
            color: var(--muted);
            font-size: 13px
        }

        .crumb strong {
            color: var(--ink);
            font-weight: 600
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 18px;
            color: var(--muted)
        }

        .top-right .bell {
            font-size: 18px
        }

        .content {
            padding: 26px 30px 50px;
            max-width: 1600px;
            margin: auto
        }

        .page-title {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 22px
        }

        .page-title h1 {
            font-size: 25px;
            margin: 0 0 7px;
            letter-spacing: -.4px
        }

        .page-title p {
            margin: 0;
            color: var(--muted)
        }

        .actions {
            display: flex;
            gap: 10px
        }

        .btn {
            border: 1px solid #cfcfcf;
            background: #fff;
            color: #333;
            border-radius: 5px;
            height: 36px;
            padding: 0 15px
        }

        .btn:hover {
            border-color: #9d9d9d
        }

        .btn.primary {
            background: var(--danger);
            border-color: var(--danger);
            color: #fff;
            font-weight: 600
        }

        .btn.primary:hover {
            background: #a80d27
        }

        .btn.ghost {
            border-color: transparent;
            background: transparent
        }

        .btn.danger {
            color: var(--danger);
            border-color: #e3b0b8;
            background: #fff7f8
        }

        .btn.small {
            height: 30px;
            padding: 0 10px;
            font-size: 12px
        }

        .filter {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 7px;
            padding: 18px 20px 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .025)
        }

        .filter-grid {
            display: grid;
            grid-template-columns: 1.5fr 1.5fr 1.2fr auto;
            gap: 15px;
            align-items: end
        }

        .field label {
            display: block;
            font-size: 12px;
            color: #555;
            margin-bottom: 7px
        }

        .required:after {
            content: ' *';
            color: var(--danger)
        }

        .control {
            width: 100%;
            height: 36px;
            border: 1px solid #d8d8d8;
            border-radius: 5px;
            padding: 0 11px;
            outline: none;
            background: #fff;
            color: #333
        }

        .control:focus {
            border-color: var(--danger);
            box-shadow: 0 0 0 2px rgba(200, 16, 46, .12)
        }

        .filter-actions {
            display: flex;
            gap: 8px
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin: 18px 0
        }

        .stat {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 7px;
            padding: 18px 20px;
            position: relative;
            overflow: hidden
        }

        .stat:after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: var(--danger)
        }

        .stat:nth-child(2):after {
            background: #222
        }

        .stat:nth-child(3):after {
            background: #999
        }

        .stat span {
            color: var(--muted);
            font-size: 12px
        }

        .stat strong {
            display: block;
            font-size: 27px;
            margin-top: 9px
        }

        .table-card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 7px;
            overflow: hidden
        }

        .table-head {
            padding: 15px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--line)
        }

        .table-head strong {
            font-size: 15px
        }

        .table-head span {
            color: var(--muted);
            font-size: 12px
        }

        .table-wrap {
            overflow: auto
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1050px
        }

        th {
            background: #fafafa;
            color: #666;
            font-size: 12px;
            font-weight: 600;
            text-align: left;
            height: 42px;
            padding: 0 15px;
            border-bottom: 1px solid var(--line);
            white-space: nowrap
        }

        td {
            padding: 14px 15px;
            border-bottom: 1px solid #eee;
            white-space: nowrap;
            vertical-align: middle
        }

        tbody tr:hover {
            background: #fffafa
        }

        .thumb {
            width: 42px;
            height: 42px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: linear-gradient(135deg, #eee, #c9c9c9);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 11px
        }

        .thumb.red {
            background: linear-gradient(135deg, #b6112b, #241b1d)
        }

        .thumb.dark {
            background: linear-gradient(135deg, #181818, #7a7a7a)
        }

        .link {
            color: var(--danger);
            font-weight: 600;
            text-decoration: none
        }

        .sub {
            display: block;
            color: var(--muted);
            font-size: 11px;
            margin-top: 4px
        }

        .tag {
            display: inline-flex;
            align-items: center;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            border: 1px solid transparent
        }

        .tag.gray {
            background: #f1f1f1;
            color: #555;
            border-color: #e4e4e4
        }

        .tag.red {
            background: var(--danger-soft);
            color: var(--danger);
            border-color: #f2c1c8
        }

        .tag.green {
            background: var(--success-soft);
            color: var(--success);
            border-color: #b9e7cc
        }

        .tag.orange {
            background: var(--warn-soft);
            color: var(--warn);
            border-color: #f1d19b
        }

        .pager {
            padding: 15px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--muted);
            font-size: 12px
        }

        .pages {
            display: flex;
            gap: 6px
        }

        .pages button {
            width: 28px;
            height: 28px;
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 4px
        }

        .pages button.active {
            background: var(--ink);
            color: #fff;
            border-color: var(--ink)
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .46);
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: center
        }

        .modal-backdrop.show {
            display: flex
        }

        .modal {
            background: #fff;
            border-radius: 8px;
            box-shadow: var(--shadow);
            width: min(1120px, calc(100vw - 60px));
            max-height: calc(100vh - 50px);
            overflow: auto
        }

        .modal-header {
            height: 62px;
            padding: 0 26px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between
        }

        .modal-header h2 {
            font-size: 18px;
            margin: 0
        }

        .close {
            border: 0;
            background: transparent;
            font-size: 22px;
            color: #777
        }

        .modal-body {
            padding: 22px 26px
        }

        .modal-footer {
            padding: 16px 26px;
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: flex-end;
            gap: 10px
        }

        .stepper {
            display: flex;
            align-items: center;
            margin-bottom: 24px
        }

        .step {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #888
        }

        .step .num {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            border: 1px solid #bbb;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px
        }

        .step.active {
            color: var(--ink);
            font-weight: 600
        }

        .step.active .num {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger)
        }

        .step.done .num {
            background: #222;
            color: #fff;
            border-color: #222
        }

        .step-line {
            width: 58px;
            border-top: 1px dashed #ccc;
            margin: 0 12px
        }

        .section {
            border: 1px solid var(--line);
            border-radius: 6px;
            margin-bottom: 15px
        }

        .section-title {
            padding: 11px 14px;
            background: #fafafa;
            border-bottom: 1px solid var(--line);
            font-weight: 600;
            font-size: 13px
        }

        .section-title:before {
            content: '';
            display: inline-block;
            width: 3px;
            height: 14px;
            background: var(--danger);
            vertical-align: -2px;
            margin-right: 8px
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            padding: 16px
        }

        .span-2 {
            grid-column: span 2
        }

        .span-3 {
            grid-column: span 3
        }

        .readonly {
            background: #f6f6f6;
            color: #777
        }

        .upload {
            border: 1px dashed #c9c9c9;
            border-radius: 5px;
            min-height: 84px;
            padding: 12px;
            display: flex;
            gap: 10px;
            align-items: center;
            background: #fcfcfc
        }

        .upload button {
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 4px;
            height: 30px;
            padding: 0 11px
        }

        .upload em {
            font-style: normal;
            color: #888;
            font-size: 12px
        }

        .help {
            color: #999;
            font-size: 12px;
            margin-left: 4px
        }

        .notice {
            padding: 11px 13px;
            background: #fff8e9;
            border: 1px solid #f1d7a4;
            border-radius: 5px;
            color: #7b5600;
            font-size: 12px
        }

        .detail {
            display: grid;
            grid-template-columns: 1.25fr .75fr;
            gap: 18px
        }

        .detail-card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 7px;
            overflow: hidden
        }

        .detail-card h3 {
            font-size: 15px;
            margin: 0;
            padding: 16px 18px;
            border-bottom: 1px solid var(--line)
        }

        .detail-body {
            padding: 18px
        }

        .kv {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px 20px
        }

        .kv-item label {
            display: block;
            color: #888;
            font-size: 12px;
            margin-bottom: 5px
        }

        .kv-item strong {
            font-weight: 500
        }

        .evidence {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px
        }

        .evidence-card {
            border: 1px solid var(--line);
            border-radius: 5px;
            padding: 13px
        }

        .evidence-card h4 {
            margin: 0 0 9px;
            font-size: 13px
        }

        .evidence-card p {
            color: #666;
            font-size: 12px;
            line-height: 1.7;
            margin: 0
        }

        .evidence-card .result {
            margin-bottom: 8px
        }

        .timeline {
            position: relative;
            padding-left: 23px
        }

        .timeline:before {
            content: '';
            position: absolute;
            left: 5px;
            top: 4px;
            bottom: 4px;
            border-left: 1px solid #ddd
        }

        .event {
            position: relative;
            margin-bottom: 21px
        }

        .event:before {
            content: '';
            position: absolute;
            left: -22px;
            top: 3px;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #aaa;
            border: 2px solid #fff;
            box-shadow: 0 0 0 1px #aaa
        }

        .event.current:before {
            background: var(--danger);
            box-shadow: 0 0 0 1px var(--danger)
        }

        .event strong {
            display: block;
            font-size: 13px
        }

        .event small {
            color: #999
        }

        .event p {
            margin: 6px 0 0;
            color: #666;
            font-size: 12px
        }

        .columns-menu {
            position: absolute;
            right: 18px;
            top: 56px;
            background: #fff;
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            border-radius: 6px;
            padding: 14px;
            width: 210px;
            z-index: 5;
            display: none
        }

        .columns-menu.show {
            display: block
        }

        .columns-menu label {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 9px 0;
            font-size: 12px
        }

        .toast {
            position: fixed;
            right: 28px;
            bottom: 28px;
            background: #222;
            color: #fff;
            padding: 12px 17px;
            border-radius: 5px;
            box-shadow: var(--shadow);
            z-index: 40;
            display: none
        }

        .toast.show {
            display: block;
            animation: fade 2.6s both
        }

        @keyframes fade {

            0%,
            100% {
                opacity: 0;
                transform: translateY(8px)
            }

            15%,
            80% {
                opacity: 1;
                transform: none
            }
        }

        @media(max-width:960px) {
            .side {
                width: 66px
            }

            .brand {
                padding: 20px 17px
            }

            .brand span,
            .nav-label,
            .nav a span,
            .user div:last-child {
                display: none
            }

            .nav a {
                justify-content: center
            }

            .content {
                padding: 20px
            }

            .filter-grid {
                grid-template-columns: 1fr 1fr
            }

            .detail {
                grid-template-columns: 1fr
            }

            .form-grid {
                grid-template-columns: 1fr 1fr
            }

            .span-3 {
                grid-column: span 2
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <aside class="side">
            <div class="brand"><b>P</b><span>AI-PIM</span></div>
            <nav class="nav">
                <div class="nav-label">选品中心</div><a class="active" href="#"><i>▦</i><span>PW 经销商提报</span></a><a
                    href="#"href=><i></i></a>
            </nav>
        </aside>
        <main class="main">
            <header class="top">
                <div class="crumb">选品中心 / <strong>PW 经销商提报</strong></div>
                <div class="top-right"><span>帮助中心</span><span class="bell">♢</span><span>2026-08-03</span></div>
            </header>
            <section class="content" id="app-content"></section>
        </main>
    </div>
    <div class="modal-backdrop" id="form-modal">
        <div class="modal">
            <div class="modal-header">
                <h2>我要提报</h2><button class="close" onclick="closeModal('form-modal')">×</button>
            </div>
            <div class="modal-body" id="form-body"></div>
            <div class="modal-footer"><button class="btn" onclick="closeModal('form-modal')">取消</button><button
                    class="btn" onclick="saveDraft()">保存草稿</button><button class="btn primary"
                    onclick="submitForm()">提交</button></div>
        </div>
    </div>
    <div class="modal-backdrop" id="columns-modal">
        <div class="modal" style="width:420px">
            <div class="modal-header">
                <h2>列设置</h2><button class="close" onclick="closeModal('columns-modal')">×</button>
            </div>
            <div class="modal-body">
                <p style="color:#777;margin-top:0">调整当前列表希望展示的字段</p>
                <div id="column-options"></div>
            </div>
            <div class="modal-footer"><button class="btn" onclick="closeModal('columns-modal')">取消</button><button
                    class="btn primary" onclick="applyColumns()">保存设置</button></div>
        </div>
    </div>
    <div class="modal-backdrop" id="detail-modal">
        <div class="modal" style="width:min(1240px,calc(100vw - 50px))">
            <div class="modal-header">
                <h2>提报详情 · PW20260803018</h2><button class="close" onclick="closeModal('detail-modal')">×</button>
            </div>
            <div class="modal-body" id="detail-body"></div>
            <div class="modal-footer"><button class="btn" onclick="closeModal('detail-modal')">关闭</button><button
                    class="btn primary" onclick="supplement()">补充指定资料</button></div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script>
        const rows = [{ no: 'PW20260803018', name: '曜石龙纹系列', code: 'LSD-00402', time: '2026-08-03 10:24', update: '2026-08-03 10:26', status: '审批中', node: '法务初审', thumb: 'red' }, { no: 'PW20260802007', name: '黑曜火焰图案', code: '-', time: '2026-08-02 16:08', update: '2026-08-02 16:08', status: '草稿', node: '-', thumb: 'dark' }, { no: 'PW20260729026', name: '城市夜行者', code: 'LSE-00388', time: '2026-07-29 14:32', update: '2026-08-01 09:15', status: '审批结束', node: '终级审批', thumb: '' }, { no: 'PW20260728011', name: '复古徽章限定款', code: '-', time: '2026-07-28 11:05', update: '2026-07-30 18:20', status: '审批结束', node: '未通过', thumb: 'dark' }];
        let currentView = new URLSearchParams(location.search).get('view') || 'list'; let formMode = 'new';
        function statusTag(s) { const c = s === '审批中' ? 'red' : s === '审批结束' ? 'green' : s === '草稿' ? 'gray' : 'orange'; return `<span class="tag ${c}">${s}</span>` }
        function render() { if (currentView === 'form') { openForm(); return } if (currentView === 'detail') { openDetail(); return } renderList() }

><small>经销商 · 2026-08-03 10:26</small><p>已提交，进入侵权检测。</p></div><div class="event"><strong>内外侵权检测</strong><small>系统 · 2026-08-03 10:26</small><p>内部检测已完成，外部结果等待接口返回。</p></div><div class="event current"><strong>法务初审</strong><small>当前节点 · 待法务处理</small><p>待法务查看检测凭证并填写审核意见。</p></div><div class="event"><strong>PW 项目负责人审批</strong><small>未开始</small></div><div class="event"><strong>终级审批</strong><small>未开始</small></div></div></div></div><div class="detail-card" style="margin-top:18px"><h3>审批历史</h3><div class="detail-body" style="padding:0"><table style="min-width:0"><thead><tr><th>节点</th><th>处理人</th><th>状态</th><th>操作时间</th></tr></thead><tbody><tr><td>发起审批</td><td>陈晓雯</td><td>${statusTag('已完成')}</td><td>08-03 10:26</td></tr><tr><td>侵权检测</td><td>系统</td><td>${statusTag('已完成')}</td><td>08-03 10:26</td></tr><tr><td>法务初审</td><td>待分配</td><td>${statusTag('审批中')}</td><td>-</td></tr></tbody></table></div></div></div></div>` }
